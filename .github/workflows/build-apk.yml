          JAVA1
          cat > $D/IslandPlugin.java << 'JAVA2'
          package com.example.dayn;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Island")
          public class IslandPlugin extends Plugin {
              @PluginMethod
              public void hasPermission(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("granted", Settings.canDrawOverlays(getContext()));
                  call.resolve(r);
              }

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  Context c = getContext();
                  Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + c.getPackageName()));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  c.startActivity(i);
                  call.resolve();
              }

              @PluginMethod
              public void update(PluginCall call) {
                  Context c = getContext();
                  if (!Settings.canDrawOverlays(c)) {
                      call.reject("no_permission");
                      return;
                  }
                  Intent i = new Intent(c, IslandService.class);
                  i.putExtra("in", call.getString("inText", ""));
                  i.putExtra("out", call.getString("outText", ""));
                  ContextCompat.startForegroundService(c, i);
                  call.resolve();
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  getContext().stopService(new Intent(getContext(), IslandService.class));
                  call.resolve();
              }
          }
          JAVA2
          cat > $D/IslandService.java << 'JAVA3'
          package com.example.dayn;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class IslandService extends Service {
              private WindowManager wm;
              private LinearLayout root;
              private TextView tin;
              private TextView tout;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private TextView label(int color) {
                  TextView t = new TextView(this);
                  t.setTextColor(color);
                  t.setTextSize(13);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setSingleLine(true);
                  return t;
              }

              private void startAsForeground() {
                  String ch = "island";
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel(ch, "Island", NotificationManager.IMPORTANCE_LOW));
                      b = new Notification.Builder(this, ch);
                  } else {
                      b = new Notification.Builder(this);
                  }
                  Notification n = b.setContentTitle("\u062f\u0641\u062a\u0631 \u0627\u0644\u062f\u064a\u0648\u0646")
                          .setContentText("\u0627\u0644\u062c\u0632\u064a\u0631\u0629 \u0646\u0634\u0637\u0629")
                          .setSmallIcon(getApplicationInfo().icon)
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(7, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(7, n);
                  }
              }

              private void build() {
                  wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.HORIZONTAL);
                  root.setGravity(Gravity.CENTER_VERTICAL);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  root.setPadding(dp(16), dp(7), dp(16), dp(7));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.BLACK);
                  bg.setCornerRadius(dp(22));
                  root.setBackground(bg);
                  tin = label(Color.parseColor("#4FD6B2"));
                  tout = label(Color.parseColor("#FF8CA0"));
                  View gap = new View(this);
                  root.addView(tin);
                  root.addView(gap, new LinearLayout.LayoutParams(dp(18), 1));
                  root.addView(tout);
                  root.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Intent li = getPackageManager().getLaunchIntentForPackage(getPackageName());
                          if (li != null) {
                              li.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(li);
                          }
                      }
                  });
                  int type = Build.VERSION.SDK_INT >= 26
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;
                  WindowManager.LayoutParams p = new WindowManager.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  p.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  p.y = dp(6);
                  wm.addView(root, p);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  SharedPreferences sp = getSharedPreferences("island", MODE_PRIVATE);
                  if (intent != null && intent.hasExtra("in")) {
                      sp.edit().putString("in", intent.getStringExtra("in")).putString("out", intent.getStringExtra("out")).apply();
                  }
                  startAsForeground();
                  if (root == null) {
                      build();
                  }
                  tin.setText(sp.getString("in", "\u0644\u064a 0"));
                  tout.setText(sp.getString("out", "\u0639\u0644\u064a 0"));
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (root != null && wm != null) {
                      try {
                          wm.removeView(root);
                      } catch (Exception e) {
                      }
                      root = null;
                  }
                  super.onDestroy();
              }
          }
