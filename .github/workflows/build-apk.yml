name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name github-actions
            git config user.email actions@github.com
            git add debug.keystore
            git commit -m "add signing key [skip ci]"
            git push
          fi
          cp debug.keystore ~/.android/debug.keystore
      - name: Write app
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>دفتر الديون</title>
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
          <style>
          :root{
            --bg:#F1F1EE;--card:#FFFFFF;--ink:#0D1B17;--mute:#68766F;--line:#E1E4DF;
            --gold:#9A7A2E;--gold-2:#C9A659;--in:#0B7A62;--out:#B4304A;
            --in-bg:rgba(11,122,98,.1);--out-bg:rgba(180,48,74,.1);--btn:#0D1B17;--btn-t:#F4E7C3;
            --hero1:#10261F;--hero2:#07120F;--hero-t:#F2EFE6;
            box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
          }
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
            --bg:#060D0B;--card:#0F1A16;--ink:#EEF1EC;--mute:#8A9A93;--line:#1A2924;
            --gold:#D8B76A;--gold-2:#F0D898;--in:#4FD6B2;--out:#FF8CA0;
            --in-bg:rgba(79,214,178,.12);--out-bg:rgba(255,140,160,.12);--btn:#D8B76A;--btn-t:#1A1405;
            --hero1:#143028;--hero2:#0A1713;}}
          :root[data-theme="dark"]{--bg:#060D0B;--card:#0F1A16;--ink:#EEF1EC;--mute:#8A9A93;--line:#1A2924;
            --gold:#D8B76A;--gold-2:#F0D898;--in:#4FD6B2;--out:#FF8CA0;--in-bg:rgba(79,214,178,.12);--out-bg:rgba(255,140,160,.12);
            --btn:#D8B76A;--btn-t:#1A1405;--hero1:#143028;--hero2:#0A1713;}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
          h1,h2,.k{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif}
          .app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 18px 120px}
          button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
          :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
          .top{display:flex;justify-content:space-between;align-items:center;padding:22px 0 16px}
          .top h1{font-size:20px;margin:0;font-weight:500}
          .top small{display:block;color:var(--mute);font-size:13px;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
          .mono{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font-family:"Noto Kufi Arabic",sans-serif;font-weight:700}
          .hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 22px 20px;color:var(--hero-t);
            background:radial-gradient(120% 90% at 100% 0%,var(--hero1),var(--hero2));border:1px solid rgba(216,183,106,.35);
            box-shadow:0 18px 40px -18px rgba(0,0,0,.5)}
          .hero::after{content:"";position:absolute;inset-inline-start:-60px;bottom:-90px;width:220px;height:220px;border-radius:50%;
            border:1px solid rgba(216,183,106,.25);box-shadow:0 0 0 28px rgba(216,183,106,.05),0 0 0 60px rgba(216,183,106,.03)}
          .hero small{color:rgba(242,239,230,.65);font-size:13px}
          .net{font-size:36px;font-weight:700;letter-spacing:-.5px;margin:2px 0 16px;color:var(--gold-2);position:relative;z-index:1}
          .net.neg{color:#FF9DAE}
          .bar{display:flex;height:6px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.1);position:relative;z-index:1}
          .bar i{display:block;height:100%}
          .bar .a{background:#4FD6B2}.bar .b{background:#FF8CA0}
          .legend{display:flex;justify-content:space-between;margin-top:12px;position:relative;z-index:1}
          .legend div b{display:block;font-size:17px}
          .legend .l1 b{color:#6FE3C4}.legend .l2 b{color:#FFA3B3}
          .tabs{display:flex;gap:6px;margin:22px 0 8px;padding:4px;background:var(--card);border-radius:99px;border:1px solid var(--line)}
          .tab{flex:1;padding:8px;border-radius:99px;font-size:14px;color:var(--mute)}
          .tab[aria-pressed="true"]{background:var(--btn);color:var(--btn-t);font-weight:500}
          .row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;text-align:right;border-bottom:1px solid var(--line)}
          .row:last-child{border-bottom:0}
          .av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;background:var(--card);border:2px solid var(--line)}
          .av.in{border-color:var(--in);color:var(--in)}.av.out{border-color:var(--out);color:var(--out)}
          .row .n{flex:1;min-width:0}
          .row .n b{display:block;font-weight:500}
          .chip{display:inline-block;font-size:12px;padding:0 9px;border-radius:99px;background:var(--line);color:var(--mute)}
          .chip.late{background:var(--out-bg);color:var(--out)}
          .amt{font-weight:500;white-space:nowrap;text-align:left;font-size:17px}
          .amt small{display:block;font-size:12px;color:var(--mute);font-weight:400}
          .pos{color:var(--in)}.neg{color:var(--out)}.zero{color:var(--mute)}
          .empty{padding:40px 16px;text-align:center;color:var(--mute)}
          .sec{margin-top:28px}
          .sh{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px;border-bottom:1px solid var(--line)}
          .sh b{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:16px;font-weight:700;display:block}
          .sh small{color:var(--mute);font-size:12px}
          .sh .t{font-weight:700;font-size:17px}
          .none{padding:18px 4px;color:var(--mute);font-size:14px}
          .fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:0 auto;width:max-content;
            background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1A1405;padding:14px 28px;border-radius:99px;font-weight:500;
            box-shadow:0 12px 28px -8px rgba(216,183,106,.55)}
          .back{padding:20px 0 6px;color:var(--mute)}
          .phero{text-align:center;padding:8px 0 18px}
          .phero .av{width:76px;height:76px;font-size:28px;margin:0 auto 10px}
          .phero .big{font-size:34px;font-weight:700;font-family:"Noto Kufi Arabic",sans-serif}
          .prog{height:6px;border-radius:9px;background:var(--line);margin:14px auto 6px;max-width:240px;overflow:hidden}
          .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
          .phero small{color:var(--mute);font-size:13px}
          .acts{display:flex;gap:8px;margin:6px 0 18px}
          .acts button{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:500}
          .acts .main{background:var(--btn);color:var(--btn-t);border-color:var(--btn)}
          .tx{display:flex;justify-content:space-between;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line)}
          .tx:last-child{border-bottom:0}
          .tx span{font-size:13px;color:var(--mute);display:block}
          .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;z-index:20}
          .scrim.on{display:block}
          .sheet{position:fixed;inset-inline:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .25s;border-top:1px solid var(--line)}
          .sheet.on{transform:none}
          .sheet::before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
          @media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
          .sheet h2{margin:0 0 6px;font-size:18px;font-weight:500}
          label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
          input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
          input:focus{border-color:var(--gold);outline:0}
          .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
          .seg button{padding:11px;border-radius:14px;border:1px solid var(--line)}
          .seg button[aria-pressed="true"].i{background:var(--in-bg);color:var(--in);border-color:var(--in)}
          .seg button[aria-pressed="true"].o{background:var(--out-bg);color:var(--out);border-color:var(--out)}
          .go{width:100%;margin-top:18px;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1A1405;font-weight:500}
          .toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
          .toast.on{opacity:1}
          .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
          .side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
          .side small{color:var(--mute);font-size:12px;display:block}
          .side .v{font-size:22px;font-weight:700;margin:2px 0 4px;font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif}
          .side .prog{margin:8px 0;max-width:none}
          .side button{width:100%;padding:9px;border-radius:12px;border:1px solid var(--line);margin-top:8px;font-size:14px;font-weight:500}
          .side button.main{background:var(--btn);color:var(--btn-t);border-color:var(--btn)}
          .hero{display:grid;grid-template-columns:1fr 1fr;padding:22px 0}
          .hs{padding:0 20px;position:relative;z-index:1}
          .hs+.hs{border-inline-start:1px solid rgba(255,255,255,.14)}
          .hs small{font-size:13px;color:rgba(242,239,230,.7)}
          .hv{font-size:24px;font-weight:700;margin:2px 0 6px;line-height:1.3}
          .hs span{display:block;font-size:12px;color:rgba(242,239,230,.6)}
          .hs.in .hv{color:#6FE3C4}.hs.out .hv{color:#FFA3B3}
          .hs .late{color:#FFA3B3}
          </style>
          </head>
          <body>
          <div class="app" id="app"></div>
          <button class="fab" id="fab">+ دين جديد</button>
          <div class="scrim" id="scrim"></div>
          <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
          <div class="toast" id="toast" role="status"></div>
          <script>
          (function(){
          var KEY="debt-ledger-v2";
          function seed(){return[];}
          var people;
          try{var raw=localStorage.getItem(KEY);people=raw?JSON.parse(raw):seed();}catch(e){people=seed();}
          if(!Array.isArray(people))people=seed();
          var SAMPLE=["أبو فهد","سارة","عبدالله العتيبي"];
          people=people.filter(function(p){return !(p.id<1000||SAMPLE.indexOf(p.name)>-1||p.name==="خالد"||p.name==="عبدالله");});
          try{localStorage.setItem(KEY,JSON.stringify(people));}catch(e){}
          var Island=null;
          try{var C=window.Capacitor;if(C){Island=(C.Plugins&&C.Plugins.Island)||(C.registerPlugin?C.registerPlugin("Island"):null);}}catch(e){}
          function islOn(){try{return localStorage.getItem("dayn-island")==="1";}catch(e){return false;}}
          function pushNow(){
            if(!Island||!islOn())return;
            var a=0,b=0;people.forEach(function(p){a+=sb(p,1);b+=sb(p,-1);});
            try{Island.update({inText:"لي "+a.toLocaleString("en-US"),outText:"علي "+b.toLocaleString("en-US")}).catch(function(){});}catch(e){}
          }
          function save(){try{localStorage.setItem(KEY,JSON.stringify(people));}catch(e){}}
          var view={screen:"home",pid:null},paySide=1;
          var $=function(i){return document.getElementById(i)};
          function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
          function fmt(n){return Math.abs(n).toLocaleString("en-US")+" ر.س";}
          function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");setTimeout(function(){el.classList.remove("on")},2200);}
          function today(){return new Date().toISOString().slice(0,10);}
          function side(x){var sg=x.a>0?1:-1;return x.p?-sg:sg;}
          function sb(p,s){var t=0;p.e.forEach(function(x){if(side(x)===s)t+=x.a;});return Math.max(0,t*s);}
          function prog(p,s){var d=0,q=0;p.e.forEach(function(x){if(side(x)!==s)return;if(x.p)q+=Math.abs(x.a);else d+=Math.abs(x.a);});return d?Math.min(100,Math.round(q/d*100)):0;}
          function dueOf(p,s){var d="";p.e.forEach(function(x){if(!x.p&&side(x)===s&&x.due)d=x.due;});return d;}
          function stat(s){var n=0,l=0;people.forEach(function(p){if(sb(p,s)>0){n++;var d=dueOf(p,s);if(d&&d<today())l++;}});
            return (n?n+(n===1?" شخص":" أشخاص"):"لا يوجد أحد")+(l?' · <b class="late" style="font-weight:500">'+l+' متأخر</b>':"");}
          function dueChip(p,s){
            if(!sb(p,s))return '<span class="chip">مسدد</span>';
            var due="";p.e.forEach(function(x){if(!x.p&&side(x)===s&&x.due)due=x.due;});
            if(!due)return '<span class="chip">بدون موعد</span>';
            var days=Math.round((new Date(due)-new Date(today()))/864e5);
            if(days<0)return '<span class="chip late">متأخر '+(-days)+' يوم</span>';
            if(days===0)return '<span class="chip late">يستحق اليوم</span>';
            return '<span class="chip">بعد '+days+' يوم</span>';
          }
          function find(id){return people.filter(function(x){return x.id===id})[0];}
          function render(){
            var app=$("app");pushNow();
            if(view.screen==="person"){renderPerson(app);$("fab").style.display="none";return;}
            $("fab").style.display="";
            var inT=0,outT=0;people.forEach(function(p){inT+=sb(p,1);outT+=sb(p,-1);});

            function row(p,s){
              return '<button class="row" data-p="'+p.id+'"><span class="av '+(s>0?"in":"out")+'">'+esc(p.name.charAt(0))+'</span>'+
               '<span class="n"><b>'+esc(p.name)+'</b>'+dueChip(p,s)+'</span>'+
               '<span class="amt '+(s>0?"pos":"neg")+'">'+fmt(sb(p,s))+'<small>'+(s>0?"لك":"عليك")+'</small></span></button>';}
            function sec(title,sub,s,total){
              var items=people.filter(function(p){return sb(p,s)>0});
              return '<div class="sec"><div class="sh"><div><b>'+title+'</b><small>'+sub+'</small></div><span class="t '+(s>0?"pos":"neg")+'">'+total+'</span></div>'+
               (items.length?items.map(function(p){return row(p,s)}).join(""):'<div class="none">ما فيه ديون هنا</div>')+'</div>';}
            var done=people.filter(function(p){return !sb(p,1)&&!sb(p,-1)});
            var h='<div class="top"><div><h1>دفتر الديون</h1><small>حساباتك مرتّبة وواضحة</small></div><div class="mono">د</div></div>'+
             '<div class="hero"><div class="hs in"><small>لي</small><div class="hv k">'+fmt(inT)+'</div><span>'+stat(1)+'</span></div>'+
             '<div class="hs out"><small>علي</small><div class="hv k">'+fmt(outT)+'</div><span>'+stat(-1)+'</span></div></div>'+
             sec("ديون لي","ناس عليهم مبالغ لك",1,fmt(inT))+sec("ديون علي","مبالغ عليك للناس",-1,fmt(outT))+
             (done.length?'<div class="sec"><div class="sh"><div><b>مسددة</b><small>تم السداد بالكامل</small></div></div>'+done.map(function(p){
               return '<button class="row" data-p="'+p.id+'"><span class="av">'+esc(p.name.charAt(0))+'</span><span class="n"><b>'+esc(p.name)+'</b></span><span class="amt zero">0</span></button>';}).join("")+'</div>':"");
            if(Island)h+='<div class="acts" style="margin-top:28px"><button id="isl">'+(islOn()?"إيقاف الجزيرة":"تفعيل الجزيرة أعلى الشاشة")+'</button></div>';
            app.innerHTML=h;
          }
          function renderPerson(app){
            var p=find(view.pid);
            if(!p){view.screen="home";return render();}
            function card(s){
              var v=sb(p,s),pc=prog(p,s);
              return '<div class="side"><small>'+(s>0?"لك عنده":"عليك له")+'</small><div class="v '+(v?(s>0?"pos":"neg"):"zero")+'">'+(v?fmt(v):"—")+'</div>'+
               (v?'<div class="prog"><i style="width:'+pc+'%"></i></div><small>سداد '+pc+'% · '+dueChip(p,s).replace(/<[^>]+>/g,"")+'</small>'+
                '<button class="main" data-pay="'+s+'">'+(s>0?"استلمت دفعة":"سدّدت دفعة")+'</button>'+(s>0?'<button id="remind">تذكير واتساب</button>':""):"")+'</div>';}
            var h='<button class="back" id="back">‹ رجوع</button>'+
             '<div class="phero"><div class="av">'+esc(p.name.charAt(0))+'</div><div>'+esc(p.name)+'</div></div>'+
             '<div class="sides">'+card(1)+card(-1)+'</div>'+
             '<div class="acts"><button class="main" id="addfor">+ دين جديد</button><button id="del">حذف</button></div>'+
             p.e.slice().reverse().map(function(x){
               var sd=side(x),t=x.p?(sd>0?"دفعة مستلمة":"دفعة مسددة"):(x.a>0?"دين لي":"دين علي");
               return '<div class="tx"><div><b style="font-weight:500">'+t+'</b><span>'+esc(x.note)+' · '+esc(x.d)+'</span></div>'+
               '<b class="'+(x.p?"zero":x.a>0?"pos":"neg")+'" style="font-weight:500">'+(x.p?"− ":"")+fmt(x.a)+'</b></div>';}).join("");
            app.innerHTML=h;
          }
          var sheetMode=null,dir=1;
          function openSheet(mode,prefill){
            sheetMode=mode;var s=$("sheet");
            if(mode==="add"){
              s.innerHTML='<h2>دين جديد</h2><div class="seg"><button class="i" data-d="1" aria-pressed="true">لي (أنا أطلبه)</button><button class="o" data-d="-1" aria-pressed="false">علي (يطلبني)</button></div>'+
               '<label for="f-name">اسم الشخص</label><input id="f-name" autocomplete="off" placeholder="مثال: محمد">'+
               '<label for="f-amt">المبلغ (ر.س)</label><input id="f-amt" type="number" inputmode="decimal" min="1">'+
               '<label for="f-due">موعد السداد</label><input id="f-due" type="date">'+
               '<label for="f-note">ملاحظة</label><input id="f-note" placeholder="اختياري">'+
               '<button class="go" id="save">حفظ الدين</button>';dir=1;
              if(prefill)$("f-name").value=prefill;
            }else{
              s.innerHTML='<h2>'+(paySide>0?"استلمت دفعة":"سدّدت دفعة")+'</h2><label for="f-amt">المبلغ (ر.س)</label><input id="f-amt" type="number" inputmode="decimal" min="1">'+
               '<label for="f-note">ملاحظة</label><input id="f-note" placeholder="مثال: تحويل بنكي"><button class="go" id="save">حفظ الدفعة</button>';
            }
            $("scrim").classList.add("on");s.classList.add("on");
            setTimeout(function(){var f=$(mode==="add"&&!prefill?"f-name":"f-amt");if(f)f.focus();},260);
          }
          function closeSheet(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");}
          function doSave(){
            var amt=parseFloat($("f-amt").value),note=$("f-note").value.trim();
            if(!(amt>0)){toast("اكتب مبلغاً صحيحاً");return;}
            if(sheetMode==="add"){
              var name=$("f-name").value.trim();
              if(!name){toast("اكتب اسم الشخص");return;}
              var p=people.filter(function(x){return x.name===name})[0];
              if(!p){p={id:Date.now(),name:name,e:[]};people.push(p);}
              p.e.push({a:dir*amt,d:today(),due:$("f-due").value,note:note});
              toast("تم حفظ الدين");
            }else{
              var q=find(view.pid),b=sb(q,paySide);
              amt=Math.min(amt,b);
              q.e.push({a:-paySide*amt,d:today(),due:"",note:note||"دفعة",p:1});
              toast("تم تسجيل الدفعة");
            }
            save();closeSheet();render();
          }
          document.addEventListener("click",function(ev){
            var t=ev.target.closest("button,.scrim");if(!t)return;
            if(t.id==="fab")openSheet("add");
            else if(t.classList.contains("scrim"))closeSheet();
            else if(t.id==="save")doSave();
            else if(t.dataset.p){view={screen:"person",pid:+t.dataset.p};render();window.scrollTo(0,0);}
            else if(t.dataset.pay){paySide=+t.dataset.pay;openSheet("pay");}
            else if(t.dataset.d){dir=+t.dataset.d;document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b===t));});}
            else if(t.id==="back"){view.screen="home";render();}
            else if(t.id==="addfor"){openSheet("add",find(view.pid).name);}
            else if(t.id==="remind"){
              var p=find(view.pid);
              var msg="السلام عليكم "+p.name+"، تذكير ودّي بمبلغ "+fmt(sb(p,1))+" المسجّل بيننا. جزاك الله خيراً.";
              window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");toast("تم تجهيز رسالة التذكير");
            }
            else if(t.id==="isl"){
              if(islOn()){try{localStorage.setItem("dayn-island","0");}catch(e){}try{Island.stop();}catch(e){}render();toast("تم إيقاف الجزيرة");}
              else{try{localStorage.setItem("dayn-island","1");}catch(e){}
                Island.hasPermission().then(function(r){
                  if(r&&r.granted){render();toast("تم تفعيل الجزيرة");}
                  else{toast("فعّل «العرض فوق التطبيقات» ثم ارجع");Island.requestPermission();}
                }).catch(function(){});}
            }
            else if(t.id==="del"){
              if(confirm("حذف هذا الشخص وكل سجلاته؟")){people=people.filter(function(x){return x.id!==view.pid});save();view.screen="home";render();toast("تم الحذف");}
            }
          });
          document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
          document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});
          render();
          })();
          </script>
          </body>
          </html>
